<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sigara Tasarruf Hesaplayıcı</title>
  <style>
    body {
      font-family: 'Segoe UI', 'Roboto', sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      color: #444;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #45a049;
    }
    .result {
      margin-top: 25px;
      padding: 20px;
      background: #e8f5e9;
      border-left: 4px solid #4CAF50;
      border-radius: 8px;
      font-size: 16px;
      color: #2e7d32;
    }
    .breakdown {
      margin-top: 10px;
      padding-left: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Sigara Tasarruf Hesaplayıcı</h2>
    <label for="dailyCount">Günde içilen sigara adedi:</label>
    <input type="number" id="dailyCount" placeholder="Örn: 10"/>

    <label for="packPrice">Bir paket sigaranın fiyatı (₺):</label>
    <input type="number" id="packPrice" step="0.01" placeholder="Örn: 60"/>

    <label for="cigarettesPerPack">Bir paketteki sigara adedi:</label>
    <input type="number" id="cigarettesPerPack" placeholder="Örn: 20"/>

    <button onclick="calculateSavings()">Hesapla</button>

    <div class="result" id="result" style="display:none;">
      <div id="total"></div>
      <div class="breakdown" id="breakdown"></div>
    </div>
  </div>

  <script>
    function calculateSavings() {
      const dailyCount = parseFloat(document.getElementById('dailyCount').value);
      const packPrice = parseFloat(document.getElementById('packPrice').value);
      const cigarettesPerPack = parseFloat(document.getElementById('cigarettesPerPack').value);

      if (isNaN(dailyCount) || isNaN(packPrice) || isNaN(cigarettesPerPack) || cigarettesPerPack === 0) {
        alert("Lütfen tüm alanları doğru şekilde doldurun.");
        return;
      }

      const dailyCost = (dailyCount / cigarettesPerPack) * packPrice;
      const weeklyCost = dailyCost * 7;
      const monthlyCost = dailyCost * 30;
      const yearlyCost = dailyCost * 365;

      document.getElementById('result').style.display = 'block';
      document.getElementById('total').innerHTML = `<strong>Günlük sigara masrafınız:</strong> ₺${dailyCost.toFixed(2)} <br><strong>Yıllık toplam tasarruf:</strong> ₺${yearlyCost.toFixed(2)}`;
      
      document.getElementById('breakdown').innerHTML = `
        <p><strong>Haftalık tasarruf:</strong> ₺${weeklyCost.toFixed(2)}</p>
        <p><strong>Aylık tasarruf:</strong> ₺${monthlyCost.toFixed(2)}</p>
        <p><strong>Yıllık tasarruf:</strong> ₺${yearlyCost.toFixed(2)}</p>
      `;
    }
  </script>
</body>
</html>
