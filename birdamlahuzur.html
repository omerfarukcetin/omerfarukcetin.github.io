<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Bir Damla Huzur</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f1ee;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .soz {
      font-size: 20px;
      margin-bottom: 30px;
      color: #333;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background-color: #875656;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    .button:hover {
      background-color: #a86a6a;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Bir Damla Huzur</h1>
  <div class="soz" id="dailyQuote">
    "Güzel söz sadakadır." – Hadis-i Şerif
  </div>

  <div class="buttons">
    <button class="button" onclick="shareInstagram()">Instagram’da Paylaş</button>
    <button class="button" onclick="shareWhatsApp()">WhatsApp’ta Gönder</button>
    <button class="button" onclick="copyToClipboard()">Kopyala</button>
  </div>
</div>

<script>
  const quote = document.getElementById("dailyQuote").innerText;

  function shareInstagram() {
    alert("Instagram doğrudan paylaşım desteklemez. Lütfen metni kopyalayıp manuel paylaşın.");
  }

  function shareWhatsApp() {
    const url = "https://wa.me/?text=" + encodeURIComponent(quote + "\nhttps://birdamlahuzur.com");
    window.open(url, "_blank");
  }

  function copyToClipboard() {
    navigator.clipboard.writeText(quote).then(() => {
      alert("Söz panoya kopyalandı!");
    });
  }
</script>

</body>
</html>
